name: Publish apt repo

# DRAFT - manual-trigger only. Needs the APT_SIGNING_KEY secret set (see
#  pkgbox/deb/apt-repo/README.md's "Production key" section) and GitHub
#  Pages enabled (Settings > Pages > Deploy from branch > gh-pages)
#  before this can actually publish anything - review both before adding
#  a real trigger (e.g. a schedule, or on: release for pkgbox/deb/act's
#  own upstream).
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install reprepro
        run: sudo apt-get update -qq && sudo apt-get install -y -qq reprepro

      - name: Install nfpm
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
        env:
          GORELEASER_CURRENT_TAG: v0.0.0

      # imported into a throwaway GNUPGHOME for this job only - never
      #  touches a real keyring, and nothing here persists past the job.
      # Passed via env:, not spliced into the script with ${{ }} - direct
      #  interpolation of a multi-line secret is its own known footgun.
      #  Separately (confirmed directly, twice): gpg --import exits 2
      #  with an "invalid armor header" warning on this key regardless -
      #  a benign export(MSYS2 gpg)/import(Ubuntu gpg) formatting quirk,
      #  not an actual failure - both runs' own gpg output shows the key
      #  imported fine ("secret key imported"). So the step checks the
      #  real postcondition (a secret key now exists) instead of trusting
      #  gpg's own exit code.
      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          echo "$APT_SIGNING_KEY" | gpg --batch --import || true
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          if [ -z "$KEYID" ]; then
            echo "::error::gpg import produced no usable secret key" >&2
            exit 1
          fi
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"

      - name: Refresh act package
        run: |
          pkgbox/deb/act/update.sh
          make -C pkgbox/deb act

      - name: Publish to apt-repo
        run: |
          sed -i "s/^SignWith: .*/SignWith: $KEYID/" pkgbox/deb/apt-repo/conf/distributions
          pkgbox/deb/apt-repo/publish.sh pkgbox/deb/act/vendor/*.deb

      - name: Export public key
        run: gpg --armor --export "$KEYID" > pkgbox/deb/apt-repo/public.asc

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pkgbox/deb/apt-repo
          publish_branch: gh-pages
          exclude_assets: conf,publish.sh,db
