# Common Shared functions for any platform
common:
  helpers:
    append_line:
      cmd: |
        append_line() {
          local DEST=$1
          local LINE=$2
          local DIR
          DIR="$(dirname "$DEST")"

          # Auto-detected, not a manifest-level flag: a destination like
          #  /etc/shells is root-owned on every platform this runs
          #  against, while every $HOME-relative dest (.bashrc, .zshrc,
          #  ...) is writable by whoever's running this script - no
          #  reason to make a manifest author remember to flag the rare
          #  case when the real filesystem already knows the answer.
          #  Existing dest checks itself (a read-only file in an
          #  otherwise-writable dir); a not-yet-existing dest checks its
          #  parent dir instead, since that's what actually has to accept
          #  the mkdir/touch/write.
          local SUDO=""
          if [ -e "$DEST" ]; then
            [ -w "$DEST" ] || SUDO="sudo"
          else
            [ -w "$DIR" ] || SUDO="sudo"
          fi

          $SUDO mkdir -p "$DIR"
          [ -f "$DEST" ] || $SUDO touch "$DEST"
          if ! grep -qxF "$LINE" "$DEST" 2>/dev/null; then
            # sudo echo ... >> "$DEST" would NOT actually gain root for
            #  the redirection - >> is set up by *this* unprivileged
            #  shell before sudo ever runs. sudo tee -a is the real fix,
            #  piped rather than prefixed, only when actually needed.
            if [ -n "$SUDO" ]; then
              echo "$LINE" | sudo tee -a "$DEST" >/dev/null
            else
              echo "$LINE" >> "$DEST"
            fi
          fi
        }
      cmd_powershell: |
        function append_line {
            param([string]$Dest, [string]$Line)
            $dir = Split-Path -Path $Dest -Parent
            if ($dir -and -not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            if (-not (Test-Path $Dest)) { New-Item -ItemType File -Path $Dest -Force | Out-Null }
            if (-not ((Get-Content $Dest -ErrorAction SilentlyContinue) -contains $Line)) {
                Add-Content -Path $Dest -Value $Line
            }
        }
    is_vm_guest:
      cmd: |
        is_vm_guest() {
          case "$(uname -s)" in
            Linux)
              if command -v systemd-detect-virt >/dev/null 2>&1; then
                [ "$(systemd-detect-virt)" != "none" ]
              elif [ -r /sys/class/dmi/id/product_name ]; then
                grep -qiE 'vmware|virtualbox|kvm|qemu|hyper-v|xen' /sys/class/dmi/id/product_name
              else
                return 1
              fi
              ;;
            Darwin)
              system_profiler SPHardwareDataType 2>/dev/null | grep -qiE 'Model (Name|Identifier):.*virtual'
              ;;
            CYGWIN*|MINGW*|MSYS*)
              powershell.exe -NoProfile -Command '(Get-CimInstance Win32_ComputerSystem).Model' 2>/dev/null | grep -qiE 'virtual|vmware|kvm|xen'
              ;;
            *)
              return 1
              ;;
          esac
        }
      # Win32_ComputerSystem.Model check on Windows: 
      #  * Hyper-V reports "Virtual Machine",
      #  * VMware "VMware Virtual Platform", 
      #  * VirtualBox "VirtualBox", 
      #  * KVM/QEMU usually "KVM"/a "Standard PC (Q35 ...)" board 
      cmd_powershell: |
        function is_vm_guest {
            $model = (Get-CimInstance -ClassName Win32_ComputerSystem).Model
            return $model -match 'Virtual|VMware|KVM|Xen'
        }
