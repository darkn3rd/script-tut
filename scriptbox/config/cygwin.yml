cygwin:
  global:
    packages:
      - script: cygwin_purge_windows_path
    lessons:
      gen_scripts:
        awk:
          packages:
            - cyg: gawk
        groovy:
          packages:
            - script: cygwin_groovy_path
        perl:
          packages:
            # perl_base (Cygwin's minimal runtime-only package) doesn't
            # include the `cpan` command-line client at all - confirmed
            # directly, `cpan` came back "command not found" even after
            # perl_base installed cleanly. The full `perl` package bundles
            # CPAN.pm's shell client and ExtUtils::MakeMaker.
            - cyg: perl
              meets: perl
            - script: cygwin_cpan_local_setup
              needs: make
            - cpan: App::cpanminus
            - cpanm: Switch
        php:
          packages:
            - cyg: php
        python3:
          packages:
            - cyg: python312
        ruby:
          packages:
            - cyg: ruby
            - cyg: ruby-rake
        tcl:
          packages:
            - cyg: tcl
      shell_scripts:
        packages:
          - cyg: bc
        csh:
          packages:
            - cyg: tcsh
        posix:
          packages:
            - cyg: dash
              needs: perl
        zsh:
          packages:
            - cyg: zsh
              script: cygwin_zsh_setup
      compiled_lang:
        packages:
          - cyg:
              - make
              - git
            meets: make
        cpp:
          packages:
            - cyg:
                - gcc-core
                - gcc-g++
                - automake
                - autoconf
                - libtool
                - binutils
                - pkg-config
                - patch
        cs:
          packages:
            - path: /cygdrive/c/Program Files/dotnet/
        java:
          packages:
            - script: cygwin_corretto_path
        rust:
          packages:
            - cyg: rust
      win_scripts:
        batch:
          packages:
            - path: /cygdrive/c/Windows/System32/
        powershell:
          packages:
            - path: /cygdrive/c/Windows/System32/WindowsPowerShell/v1.0/
    testbox:
      packages:
        - cyg: ruby
        - path: /cygdrive/c/Windows/System32/WindowsPowerShell/v1.0/
    scriptbox:
      packages:
        - cyg: ruby
        - cyg: rubygems
        - cyg: ruby-devel
        - cyg: libclang-devel
        - cyg: clang
        - script: cygwin_update_gems
        - script: cygwin_ratatui_ruby_gem
scripts:
  cygwin_purge_windows_path:
    type: bash
    # See msys2_purge_windows_path's own comment - same fix, same reason.
    # Cygwin's own Windows-mapped prefix is /cygdrive/, not /c/ - the
    # single generalized pattern msys2 uses doesn't apply here.
    cmd: |
      grep -qxF '# purge-windows-path' ~/.bashrc 2>/dev/null || cat >> ~/.bashrc <<'EOF'
      # purge-windows-path
      export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '^/cygdrive' | paste -sd ':')
      EOF

      export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '^/cygdrive' | paste -sd ':')
  cygwin_zsh_setup:
    type: bash
    # See msys2_zsh_setup's own comment - same fix, same reason (zsh's own
    # skel .zshrc only gets created on first interactive launch, which
    # never happens during non-interactive provisioning).
    cmd: |
      touch ~/.zshrc
      grep -qxF '# purge-windows-path' ~/.zshrc 2>/dev/null || cat >> ~/.zshrc <<'EOF'
      # purge-windows-path
      export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '^/cygdrive' | paste -sd ':')
      EOF
  cygwin_cpan_local_setup:
    type: bash
    cmd: |
      #  Force ExtUtils::MakeMaker's own prompt() to silently accept
      #    every default answer instead of blocking on stdin.
      PERL_MM_USE_DEFAULT=1 PERL_MM_OPT="INSTALL_BASE=$HOME/perl5" cpan local::lib

      # local::lib's own perl -Mlocal::lib=... invocation decides its OUTPUT
      #  SYNTAX (bash `export` vs Windows batch `@if`/`@set`) by checking
      #  $ENV{SHELL}'s basename BEFORE even looking at $^O (see
      #  guess_shelltype in local/lib.pm) - confirmed directly against a
      #  real failure: this whole chain (pwsh -> bash.exe) inherits
      #  SHELL=cmd.exe from sshd's own default shell further up, and
      #  nothing normally resets it, so local::lib silently emits
      #  Windows batch syntax that `eval` then tries to run as bash
      #  commands. Exported (not just set) so child processes - and this
      #  same line re-run from ~/.bashrc on every future interactive
      #  session - see the correct value too.
      grep -qxF 'export SHELL=/bin/bash' ~/.bashrc 2>/dev/null || echo 'export SHELL=/bin/bash' >> ~/.bashrc
      grep -qxF 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' ~/.bashrc 2>/dev/null || echo 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' >> ~/.bashrc
      grep -qxF 'export PATH=$HOME/perl5/bin:$PATH' ~/.bashrc 2>/dev/null || echo 'export PATH=$HOME/perl5/bin:$PATH' >> ~/.bashrc
      if [[ -f $HOME/.zshrc ]]; then
        grep -qxF 'export SHELL=/bin/zsh' ~/.zshrc 2>/dev/null || echo 'export SHELL=/bin/zsh' >> ~/.zshrc
        grep -qxF 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' ~/.zshrc 2>/dev/null || echo 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' >> ~/.zshrc
        grep -qxF 'export PATH=$HOME/perl5/bin:$PATH' ~/.zshrc 2>/dev/null || echo 'export PATH=$HOME/perl5/bin:$PATH' >> ~/.zshrc
      fi

      # Direct, not `source ~/.bashrc` - a script run non-interactively
      # (any provisioner, or even a human running this file with `bash
      # script.sh`) hits nearly every default .bashrc's own "return if
      # not interactive" guard before ever reaching the lines just
      # appended above, so they'd never take effect in this process.
      export SHELL=/bin/bash
      eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      export PATH=$HOME/perl5/bin:$PATH
  cygwin_corretto_path:
    type: bash
    # See msys2_corretto_path's own comment - same fix, same reason
    # (Chocolatey's corretto17jdk build number already drifted once).
    cmd: |
      CORRETTO_BIN=$(ls -d "/cygdrive/c/Program Files/Amazon Corretto/jdk17."*"/bin" 2>/dev/null | sort -V | tail -1)
      if [ -n "$CORRETTO_BIN" ]; then
        grep -qxF "export PATH=\"$CORRETTO_BIN:\$PATH\"" ~/.bashrc 2>/dev/null || echo "export PATH=\"$CORRETTO_BIN:\$PATH\"" >> ~/.bashrc
        if [[ -f $HOME/.zshrc ]]; then
          grep -qxF "export PATH=\"$CORRETTO_BIN:\$PATH\"" ~/.zshrc 2>/dev/null || echo "export PATH=\"$CORRETTO_BIN:\$PATH\"" >> ~/.zshrc
        fi
        export PATH="$CORRETTO_BIN:$PATH"
      else
        echo "WARNING: no Amazon Corretto jdk17.* found under /cygdrive/c/Program Files/Amazon Corretto/" >&2
      fi
  cygwin_groovy_path:
    type: bash
    # See msys2_corretto_path's own comment - same fix, same reason
    # (Chocolatey's groovy package embeds its version number in the
    # install directory, which drifts on every package update).
    cmd: |
      GROOVY_BIN=$(ls -d "/cygdrive/c/tools/groovy-"*"/bin" 2>/dev/null | sort -V | tail -1)
      if [ -n "$GROOVY_BIN" ]; then
        grep -qxF "export PATH=\"$GROOVY_BIN:\$PATH\"" ~/.bashrc 2>/dev/null || echo "export PATH=\"$GROOVY_BIN:\$PATH\"" >> ~/.bashrc
        if [[ -f $HOME/.zshrc ]]; then
          grep -qxF "export PATH=\"$GROOVY_BIN:\$PATH\"" ~/.zshrc 2>/dev/null || echo "export PATH=\"$GROOVY_BIN:\$PATH\"" >> ~/.zshrc
        fi
        export PATH="$GROOVY_BIN:$PATH"
      else
        echo "WARNING: no groovy-* found under /cygdrive/c/tools/" >&2
      fi
  cygwin_update_gems:
    type: bash
    cmd: gem update --system
  cygwin_ratatui_ruby_gem:
    type: bash
    cmd: |
      # clang.dll must match your installed clang version - derived dynamically
      # rather than hardcoded, since it drifts with whatever clang apt-cyg installs
      CLANG_VER=$(cygcheck -c clang | awk '/^clang / {print $2}' | cut -d. -f1,2)
      ln -sf "/usr/bin/cygclang-${CLANG_VER}.dll" /usr/bin/clang.dll
      export LIBCLANG_PATH=/usr/bin

      # without this, bindgen's clang run fails with: error: 'short __wchar_t' is invalid
      export BINDGEN_EXTRA_CLANG_ARGS="-D__wchar_t=__cygwin_wchar_t"

      # without this, the final Rust link step fails with undefined references to
      # rb_protect/rb_errinfo/rb_cBasicObject/etc (see patch file for why rb_sys doesn't
      # add this itself on Cygwin)
      export RUSTFLAGS="-C link-arg=-lruby400"

      # Derived from this script's own location, not $(pwd) - confirmed
      # directly this matters: invoked non-interactively (e.g. `bash -lc
      # "/path/to/cygwin_install.sh"` from a login shell), the working
      # directory is $HOME, not scriptbox/, so $(pwd)/patches silently
      # pointed at a directory that doesn't exist.
      SCRIPTBOX_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
      export RUBYOPT="-I${SCRIPTBOX_DIR}/patches -rrb_sys_cygwin_patch"
      gem install ratatui_ruby

      # fix interactive freezing
      RATATUI_RUBY_GEM_PATH="$(ruby -e 'puts Gem::Specification.find_by_name("ratatui_ruby").gem_dir')"
      cd "$RATATUI_RUBY_GEM_PATH/ext/ratatui_ruby"

      # Must match whatever ratatui-crossterm actually pulled in on the install
      # above (from Cargo.lock, not guessed) - otherwise Cargo resolves a second,
      # separate crossterm instance instead of unifying features onto the one
      # ratatui-crossterm actually uses, and use-dev-tty never takes effect.
      CROSSTERM_VER=$(grep -A1 'name = "crossterm"' Cargo.lock \
        | grep version \
        | sed -E 's/.*"([0-9]+\.[0-9]+)\.[0-9]+"/\1/'
      )

      grep -q '\[dependencies.crossterm\]' Cargo.toml || cat >> Cargo.toml <<EOF

      [dependencies.crossterm]
      version = "$CROSSTERM_VER"
      features = ["use-dev-tty"]
      EOF

      make
      # `make` alone only rebuilds `ratatui_ruby.so` inside `ext/ratatui_ruby/` - that's not the
      #  copy Ruby's `require` actually loads. Find the real one (the `/extensions/` path
      #  segment is what distinguishes it from the just-built one sitting right here) and
      #  overwrite it:
      RATATUI_RUBY_SO_EXT_DEST=$(find ~/.local/share/gem /usr/share/gems \
        -path "*/extensions/*/ratatui_ruby.so" 2>/dev/null \
        | head -1
      )
      cp ratatui_ruby.so "$RATATUI_RUBY_SO_EXT_DEST"
