ubuntu22:
  global:
    packages:
      - apt: zsh
        script: ubuntu_default_zshrc
      - script: unbuntu22_wsl2_clean
      - script: ubuntu22_sdkman
        tags: [sdkman]
      - apt: ['curl','git','make','wget']
    lessons:
      gen_scripts:
        packages:
          - apt:
              - autoconf
              - bison
              - build-essential
              - libbz2-dev
              - libdb-dev
              - libffi-dev
              - libgdbm6
              - libgdbm-dev
              - liblzma-dev
              - libncurses5-dev
              - libncursesw5-dev
              - libreadline6-dev
              - libreadline-dev
              - libsqlite3-dev
              - libssl-dev
              - libxml2-dev
              - libxmlsec1-dev
              - libyaml-dev
              - llvm
              - tk-dev
              - xz-utils
              - zlib1g-dev
            tags: [pyenv,rbenv]
          - script: ubuntu22_rbenv
            tags: [rbenv]
            meets: rbenv
          - script: ubuntu22_pyenv
            tags: [pyenv]
        awk:
          packages:
            - apt: gawk
        groovy:
          packages:
            - sdkman: groovy
              needs: java
              tags: [sdkman]
        perl:
          packages:
            - system: perl
              meets: perl
              script: ubuntu22_cpan_local_setup
            - cpan: App::cpanminus
            - cpanm: Switch
        php:
          packages:
            - apt: php8.1-cli
        python2:
          packages:
            - pyenv: 2.7.18
              cmd: pyenv global 3.14.7 2.7.18
              needs: pyenv3
              tags: [pyenv,python2]
        python3:
          packages:
            - system: python # 3.10.x
            - pyenv: 3.14.7
              cmd: pyenv global 3.14.7
              meets: pyenv3
              tags: [pyenv]
        ruby:
          packages:
            - system: ruby # 3.0.x
            - rbenv: 4.0.6
              cmd: rbenv global 4.0.6
              tags: [rbenv]
              meets: ruby
              needs: rbenv
        tcl:
          packages:
            - apt: tcl8.6
      shell_scripts:
        bash:
            packages: 
              - system: bash
        csh:
            packages: 
              - apt: tcsh
        ksh:
            packages: 
              - apt: ksh93u+m
        posix:
            packages: 
              - system: dash
              - needs: perl
        zsh:
            packages:
            - apt: zsh
      compiled_lang:
        packages:
          - apt: curl
          - apt: build-essential
            meets: make
        cs:
          packages:
            - script: ubuntu22_dotnet_10
        java:
          packages:
            - apt: openjdk-17-jdk
              meets: java
        go:
          packages:
            - script: ubuntu22_go
        rust:
          packages:
            - script: ubuntu22_rust
      win_scripts:
        powershell:
          packages:
            - script: ubuntu22_powershell
    cibox:
    scriptbox:
      packages:
        # A bare `cmd:` with no recognized package type alongside it
        # isn't a step `flatten` (resolve_order.rb) knows how to handle
        # - it's silently dropped, never even reaching bash_for/
        # command_for to produce a "TODO: unsupported type" line the
        # way an unrecognized *type* would - confirmed directly this
        # never appeared anywhere in generated output. `script:` is the
        # right shape for a standalone command with no package
        # attached, same as every other platform's own *_update_gems.
        - cmd: gem update --system
          needs: ruby
          tags: [rbenv]
        - apt: [clang, libclang-dev]
          # Skip incompatible precompiled binary with glibc 2.39
          # and compile from source using glibc 2.35
        - gem: ratatui_ruby --platform ruby
    testbox:
      packages:
        - script: ubuntu22_powershell
        - rbenv: 4.0.6
          cmd: rbenv global 4.0.6
          tags: [rbenv]
          meets: ruby
          needs: rbenv

scripts:
  ubuntu22_rust:
    type: bash
    cmd: |
      # Skip if already installed - re-provisioning shouldn't re-run this
      # or duplicate the profile lines below on every pass.
      if [ ! -d "$HOME/.cargo" ]; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --no-modify-path
        echo 'source "$HOME/.cargo/env"' >> ~/.bashrc
        [[ -f $HOME/.zshrc ]] && echo 'source "$HOME/.cargo/env"' >> ~/.zshrc

        # PowerShell - rustup's own post-install message tells PowerShell
        #  users to source $HOME/.cargo/env.ps1, but never actually
        #  generates it (only env/env.fish/env.tcsh land in ~/.cargo/) -
        #  confirmed directly. Write the missing file ourselves, a direct
        #  translation of env's own colon-affixed PATH check, then source
        #  it from the profile exactly the way .bashrc/.zshrc already
        #  source the real env above.
        cat <<'EOF' > "$HOME/.cargo/env.ps1"
      # rustup shell setup
      # affix colons on either side of $env:PATH to simplify matching
      if (":${env:PATH}:" -notlike "*:$HOME/.cargo/bin:*") {
          # Prepending path in case a system-installed rustc needs to be overridden
          $env:PATH = "$HOME/.cargo/bin:$env:PATH"
      }
      EOF
        mkdir -p "$HOME/.config/powershell"
        echo '. "$HOME/.cargo/env.ps1"' >> "$HOME/.config/powershell/Microsoft.PowerShell_profile.ps1"
      fi

      # Direct, not `source ~/.bashrc` - see ubuntu22_pyenv's own comment
      # for why that doesn't work under a non-interactive provisioner.
      source "$HOME/.cargo/env"
  ubuntu22_powershell:
    type: bash
    cmd: |
      wget -q https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb \
        -O packages-microsoft-prod.deb
      sudo DEBIAN_FRONTEND=noninteractive dpkg -i packages-microsoft-prod.deb
      rm packages-microsoft-prod.deb

      # Add Microsoft packages list
      sudo apt-get update

      # Install PowerShell 7.x (pwsh)
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y powershell

      # psake - win_scripts/powershell lessons run through Invoke-Psake
      #  (see scriptbox/scripts/run_all_tests.ps1), which needs the
      #  psake module installed. A plain Install-Module prompts
      #  "Untrusted repository... Are you sure you want to install
      #  software from this untrusted source?" the first time PSGallery
      #  is used - trust it first, then -Force/-SkipPublisherCheck skip
      #  that confirmation non-interactively.
      pwsh -NoProfile -Command "Set-PSRepository -Name PSGallery -InstallationPolicy Trusted; Install-Module -Name psake -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber"
  ubuntu22_pyenv:
    type: bash
    cmd: |
      # pyenv.run refuses to run again once $HOME/.pyenv exists ("Kindly
      # remove the '/root/.pyenv' directory first") - confirmed directly
      # against a real re-provision failure - so skip it entirely rather
      # than just catching the error.
      if [ ! -d "$HOME/.pyenv" ]; then
        curl https://pyenv.run | bash

        # Profile Setup
        echo 'export PYENV_ROOT="$HOME/.pyenv"' >> ~/.bashrc
        echo '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"' >> ~/.bashrc
        echo 'eval "$(pyenv init - bash)"' >> ~/.bashrc

        if [[ -f $HOME/.zshrc ]]; then
          echo 'export PYENV_ROOT="$HOME/.pyenv"' >> ~/.zshrc
          echo '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"' >> ~/.zshrc
          echo 'eval "$(pyenv init - zsh)"' >> ~/.zshrc
        fi
      fi

      export PYENV_ROOT="$HOME/.pyenv"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init - bash)"

      # Update List
      pyenv update
  ubuntu22_rbenv:
    type: bash
    cmd: |
      # rbenv/ruby-build come from rbenv's own official installer, not
      # apt - confirmed directly against a real failure this matters,
      # not just a style preference: Ubuntu's own rbenv/ruby-build apt
      # packages install to /usr/bin, a completely different,
      # incompatible layout than the ~/.rbenv/ this whole script
      # assumes - and ruby-build's apt package is frozen at an April
      # 2020 snapshot (`ruby-build 20200401-1build1`, only knows Ruby
      # versions up to 2.7.1), so `rbenv install 4.0.6` fails outright
      # with "ruby-build: definition not found: 4.0.6". Remove them if
      # a previous provision installed them, so nothing is left
      # shadowed-but-confusing on `dpkg -l`.
      sudo apt-get remove -y rbenv ruby-build 2>/dev/null || true

      # https://github.com/rbenv/rbenv-installer - officially
      # idempotent (installs fresh or updates in place under
      # $HOME/.rbenv) and installs ruby-build alongside it in the same
      # call, so no separate plugin clone step is needed.
      curl -fsSL https://github.com/rbenv/rbenv-installer/raw/HEAD/bin/rbenv-installer | bash

      # Profile Setup - grep-guarded rather than skipped-if-first-run:
      # the installer itself runs on every re-provision (to pick up
      # updates), so there's no single "already done" signal to skip
      # this block on - only the append lines themselves would
      # otherwise duplicate.
      grep -qxF 'export PATH="$HOME/.rbenv/bin:$PATH"' ~/.bashrc 2>/dev/null || echo 'export PATH="$HOME/.rbenv/bin:$PATH"' >> ~/.bashrc
      grep -qxF 'eval "$(rbenv init - bash)"' ~/.bashrc 2>/dev/null || echo 'eval "$(rbenv init - bash)"' >> ~/.bashrc
      if [[ -f $HOME/.zshrc ]]; then
        grep -qxF 'export PATH="$HOME/.rbenv/bin:$PATH"' ~/.zshrc 2>/dev/null || echo 'export PATH="$HOME/.rbenv/bin:$PATH"' >> ~/.zshrc
        grep -qxF 'eval "$(rbenv init - zsh)"' ~/.zshrc 2>/dev/null || echo 'eval "$(rbenv init - zsh)"' >> ~/.zshrc
      fi

      export PATH="$HOME/.rbenv/bin:$PATH"
      eval "$(rbenv init - bash)"
  ubuntu22_go:
    type: bash
    cmd: |
      # https://go.dev/wiki/Ubuntu
      sudo add-apt-repository -y ppa:longsleep/golang-backports
      sudo apt update \
        && sudo DEBIAN_FRONTEND=noninteractive apt install -y golang-go
      
      # Grep-guarded - see ubuntu22_post_rbenv's own comment on why
      # (go itself is already installed idempotently via apt).
      grep -qxF 'export GOPATH=$(go env GOPATH)' ~/.bashrc 2>/dev/null || echo 'export GOPATH=$(go env GOPATH)' >> ~/.bashrc
      grep -qxF 'export PATH=$GOPATH/bin:$PATH' ~/.bashrc 2>/dev/null || echo 'export PATH=$GOPATH/bin:$PATH' >> ~/.bashrc
      if [[ -f $HOME/.zshrc ]]; then
        grep -qxF 'export GOPATH=$(go env GOPATH)' ~/.zshrc 2>/dev/null || echo 'export GOPATH=$(go env GOPATH)' >> ~/.zshrc
        grep -qxF 'export PATH=$GOPATH/bin:$PATH' ~/.zshrc 2>/dev/null || echo 'export PATH=$GOPATH/bin:$PATH' >> ~/.zshrc
      fi

      export GOPATH=$(go env GOPATH)
      export PATH=$GOPATH/bin:$PATH
  ubuntu22_cpan_local_setup:
    type: bash
    cmd: |
      #  Force ExtUtils::MakeMaker's own prompt() to silently accept
      #    every default answer instead of blocking on stdin.
      PERL_MM_USE_DEFAULT=1 PERL_MM_OPT="INSTALL_BASE=$HOME/perl5" cpan local::lib
      # Grep-guarded - see ubuntu22_post_rbenv's own comment on why.
      grep -qxF 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' ~/.bashrc 2>/dev/null || echo 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' >> ~/.bashrc
      grep -qxF 'export PATH=$HOME/perl5/bin:$PATH' ~/.bashrc 2>/dev/null || echo 'export PATH=$HOME/perl5/bin:$PATH' >> ~/.bashrc
      if [[ -f $HOME/.zshrc ]]; then
        grep -qxF 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' ~/.zshrc 2>/dev/null || echo 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' >> ~/.zshrc
        grep -qxF 'export PATH=$HOME/perl5/bin:$PATH' ~/.zshrc 2>/dev/null || echo 'export PATH=$HOME/perl5/bin:$PATH' >> ~/.zshrc
      fi

      eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      export PATH=$HOME/perl5/bin:$PATH
  ubuntu22_coretto_17:
    type: bash
    cmd:  |
      KEYRING="/usr/share/keyrings/corretto-keyring.gpg"
      wget -O - https://apt.corretto.aws/corretto.key \
        | sudo gpg --dearmor -o $KEYRING --yes
      echo "deb [signed-by=$KEYRING] https://apt.corretto.aws stable main" \
        | sudo tee /etc/apt/sources.list.d/corretto.list
      sudo apt update && \
        sudo DEBIAN_FRONTEND=noninteractive apt install -y java-17-amazon-corretto-jdk

      # Grep-guarded - see ubuntu22_post_rbenv's own comment on why.
      grep -qxF "export JAVA_HOME=\$(readlink -f /usr/bin/java | sed 's|/bin/java||')" ~/.bashrc 2>/dev/null || echo "export JAVA_HOME=\$(readlink -f /usr/bin/java | sed 's|/bin/java||')" >> ~/.bashrc
      export JAVA_HOME=$(readlink -f /usr/bin/java | sed 's|/bin/java||')
  unbuntu22_wsl2_clean:
    type: sh
    cmd: |
      if grep -q "microsoft" /proc/version; then
        CLEAN_PATH="$(echo "$PATH" | tr ':' '\n' | grep -v '/mnt/c/' | tr '\n' ':' | sed 's/:$//')"
        CLEAN_LINE="export PATH=$CLEAN_PATH:/mnt/c/Windows/system32"
        grep -qxF "$CLEAN_LINE" ~/.bashrc 2>/dev/null || printf "\n%s\n" "$CLEAN_LINE" >> ~/.bashrc
        [[ -f $HOME/.zshrc ]] && { grep -qxF "$CLEAN_LINE" ~/.zshrc 2>/dev/null || printf "\n%s\n" "$CLEAN_LINE" >> ~/.zshrc; }
      fi
  ubuntu22_sdkman:
    type: bash
    cmd: |
      # Skip if already installed - see ubuntu22_pyenv's own comment on why.
      if [ ! -d "$HOME/.sdkman" ]; then
        curl -s "https://get.sdkman.io" | bash
        sed -i 's/sdkman_auto_answer=false/sdkman_auto_answer=true/' "$HOME/.sdkman/etc/config"
        echo '[[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"' >> ~/.bashrc
        if [[ -f $HOME/.zshrc ]]; then
          echo '[[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"' >> ~/.zshrc
        fi
      fi

      source "$HOME/.sdkman/bin/sdkman-init.sh"
  ubuntu22_dotnet_10:
    type: bash
    cmd: |
      sudo add-apt-repository -y ppa:dotnet/backports
      sudo apt-get update && \
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dotnet-sdk-10.0
  ubuntu_default_zshrc:
    type: bash
    cmd: |
      cat <<'EOF' > $HOME/.zshrc
      # Set up the prompt

      autoload -Uz promptinit
      promptinit
      prompt adam1

      setopt histignorealldups sharehistory

      # Use emacs keybindings even if our EDITOR is set to vi
      bindkey -e

      # Keep 1000 lines of history within the shell and save it to ~/.zsh_history:
      HISTSIZE=1000
      SAVEHIST=1000
      HISTFILE=~/.zsh_history

      # Use modern completion system
      autoload -Uz compinit
      compinit

      zstyle ':completion:*' auto-description 'specify: %d'
      zstyle ':completion:*' completer _expand _complete _correct _approximate
      zstyle ':completion:*' format 'Completing %d'
      zstyle ':completion:*' group-name ''
      zstyle ':completion:*' menu select=2
      eval "$(dircolors -b)"
      zstyle ':completion:*:default' list-colors ${(s.:.)LS_COLORS}
      zstyle ':completion:*' list-colors ''
      zstyle ':completion:*' list-prompt %SAt %p: Hit TAB for more, or the character to insert%s
      zstyle ':completion:*' matcher-list '' 'm:{a-z}={A-Z}' 'm:{a-zA-Z}={A-Za-z}' 'r:|[._-]=* r:|=* l:|=*'
      zstyle ':completion:*' menu select=long
      zstyle ':completion:*' select-prompt %SScrolling active: current selection at %p%s
      zstyle ':completion:*' use-compctl false
      zstyle ':completion:*' verbose true

      zstyle ':completion:*:*:kill:*:processes' list-colors '=(#b) #([0-9]#)*=0=01;31'
      zstyle ':completion:*:kill:*' command 'ps -u $USER -o pid,%cpu,tty,cputime,cmd'

      EOF