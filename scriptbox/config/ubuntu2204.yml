ubuntu22:
  variables: 
    ruby_ver: 4.0.6
    python_ver: 3.14.7
    python2_ver: 2.7.18
    asdf_ver: v0.20.0
    groovy_ver: 5.1.0
  apt_mirror: https://archive.ubuntu.com/ubuntu/
  global:
    packages:
      - cmd: sudo apt update
      - apt: zsh
        file: ubuntu_default_zshrc
      - script: unbuntu22_wsl2_clean
      - apt: ['curl','git','make','wget', 'gnupg2']
        meets: make
      - cmd: mkdir -p $HOME/.local/bin
      - script: ubuntu22_asdf
        file: ubuntu22_asdf_ps1
        append:
          - ubuntu22_asdf_bash
          - ubuntu22_asdf_zsh
          - ubuntu22_asdf_ps1
        meets: asdf
        tags: [asdf]
    lessons:
      packages:
        # Some networks (a home router with no real IPv6 uplink;
        #  VirtualBox's own NAT adapter, which hands out a dead ULA
        #  address) leave this host with an IPv6 address that's
        #  configured but goes nowhere. glibc's own getaddrinfo() still
        #  prefers it over IPv4, and not every client falls back to IPv4
        #  cleanly when it doesn't route - gpg2/dirmngr's keyserver
        #  lookups (see ubuntu22_rvm below) are a known example.
        #  Disabling IPv6 at the kernel level here, first, covers every
        #  later step at once instead of chasing down and patching each
        #  client's own no-IPv6/prefer-IPv4 knob individually.
        - sysctl:
            - net.ipv6.conf.all.disable_ipv6=1
            - net.ipv6.conf.default.disable_ipv6=1
        - script: ubuntu22_sdkman
          append: ubuntu22_sdkman
          meets: sdkman
          tags: [sdkman]
      gen_scripts:
        packages:
          # Shared requirements for cpan, rbenv, pyenv
          - apt:
              - autoconf
              - bison
              - build-essential
              - libbz2-dev
              - libdb-dev
              - libffi-dev
              - libgdbm6
              - libgdbm-dev
              - liblzma-dev
              - libncurses5-dev
              - libncursesw5-dev
              - libreadline6-dev
              - libreadline-dev
              - libsqlite3-dev
              - libssl-dev
              - libxml2-dev
              - libxmlsec1-dev
              - libyaml-dev
              - llvm
              - tk-dev
              - xz-utils
              - zlib1g-dev
            tags: [pyenv,rbenv,asdf_ruby,asdf_python,rvm]
          - script: ubuntu22_rbenv
            tags: [rbenv]
            append:
              - ubuntu22_rbenv_bash
              - ubuntu22_rbenv_zsh
            meets: rbenv
          - script: ubuntu22_rvm
            meets: rvm
            tags: [rvm]
          - script: ubuntu22_pyenv
            append:
              - ubuntu22_pyenv_bash
              - ubuntu22_pyenv_zsh
            tags: [pyenv]
          - asdf_plugin: ruby https://github.com/asdf-vm/asdf-ruby.git
            tags: [asdf_ruby]
            needs: asdf
          - asdf_plugin: python https://github.com/asdf-community/asdf-python.git
            tags: [asdf_python]
            needs: asdf
          - asdf_plugin: groovy https://github.com/weibemoura/asdf-groovy.git
            tags: [asdf_groovy]
            needs: asdf
        awk:
          packages:
            - apt: gawk
        perl:
          packages:
            - system: perl
              meets: perl
              script: ubuntu22_cpan_local_setup
              append: ubuntu22_cpan_local_setup
              needs: make
            - cpan: App::cpanminus
              meets: cpanm
            - cpanm: Switch
        groovy:
          packages:
            - cpanm: HTTP::Tiny
              needs: cpanm
              tags: [sdkman_groovy, default]
            - sdkman: groovy <%= $groovy_ver %>
              cmd: sdk default groovy <%= $groovy_ver %>
              needs: [java, sdkman]
              tags: [sdkman_groovy, default]
            - asdf: groovy <%= $groovy_ver %>
              cmd: asdf set -u groovy <%= $groovy_ver %>
              needs: asdf
              tags: [asdf_groovy]
        php:
          packages:
            - apt: php8.1-cli
        python2:
          packages:
            - pyenv: <%= $python2_ver %>
              cmd: pyenv global <%= $python_ver %>  <%= $python2_ver %>
              needs: pyenv3
              tags: [pyenv,python2]
        python3:
          packages:
            - system: python # 3.10.x
            - pyenv: <%= $python_ver %>
              cmd: pyenv global <%= $python_ver %>
              meets: pyenv3
              tags: [pyenv]
            - asdf: python <%= $python_ver %>
              cmd: asdf set -u python <%= $python_ver %>
              meets: pyenv3
              needs: asdf
              tags: [asdf_python]
        ruby:
          packages:
            - system: ruby
              meets: ruby 3.0
            - rbenv: <%= $ruby_ver %>
              cmd: rbenv global <%= $ruby_ver %>
              tags: [rbenv]
              meets: ruby <%= $ruby_ver %>
              needs: rbenv
            - asdf: ruby <%= $ruby_ver %>
              cmd: asdf set -u ruby <%= $ruby_ver %>
              meets: ruby <%= $ruby_ver %>
              needs: asdf
              tags: [asdf_ruby]
            - rvm: <%= $ruby_ver %>
              cmd: rvm use <%= $ruby_ver %> --default
              meets: ruby <%= $ruby_ver %>
              needs: rvm
              tags: [rvm, default]              
        tcl:
          packages:
            - system: tcl8.6 # 8.6.12
      shell_scripts:
        bash:
            packages: 
              - system: bash
        csh:
            packages: 
              - apt: tcsh
        ksh:
            packages: 
              - apt: ksh93u+m
        posix:
            packages: 
              - system: dash
              - needs: perl
        zsh:
            packages:
            - apt: zsh
              file: ubuntu_default_zshrc
      compiled_lang:
        packages:
          - apt: curl
          - apt: build-essential
            meets: make
        cs:
          packages:
            - apt_repository: ppa:dotnet/backports
              apt: dotnet-sdk-10.0
        java:
          packages:
            - apt: openjdk-17-jdk
              meets: java
            - sdkman: java 17.0.20-amzn
              cmd: sdk default java 17.0.20-amzn
              meets: java
              needs: sdkman
              tags: [sdkman_java]
        go:
          packages:
            - apt_repository: ppa:longsleep/golang-backports
              apt: golang-go
              append: ubuntu22_go
        rust:
          packages:
            - script: ubuntu22_rust
              append:
                - ubuntu22_rust_shell
                - ubuntu22_rust_ps1
              file: ubuntu22_rust_ps1
      win_scripts:
        powershell:
          packages:
            - add_apt_repo: ubuntu22_microsoft_prod
              apt: powershell
              meets: pwsh
    cibox:
      packages:
        - add_apt_repo: ubuntu22_docker
          apt:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
        #- cmd: curl https://raw.githubusercontent.com/nektos/act/master/install.sh | sudo bash
        - add_apt_repo: ubuntu22_script_tut
          apt: act
    pkgbox:
      packages:
        - add_apt_repo: ubuntu22_nfpm
          apt: nfpm
    scriptbox:
      packages:
        - script: ubuntu22_gem_update
          needs: ruby
          tags: [rbenv]
        - apt: [clang, libclang-dev]
          # Skip incompatible precompiled binary with glibc 2.39
          # and compile from source using glibc 2.35
        - gem: ratatui_ruby
          args: --platform ruby
          needs: ruby >= 3.2
    testbox:
      packages:
        - powershell_cmd: Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          needs: pwsh
        - powershell_module: psake
        - noop: ruby
          needs: ruby

scripts:
  ubuntu22_gem_update:
    type: bash
    cmd: |
      URL="https://rubygems.org/api/v1/versions/rubygems-update/latest.json"
      if [[ "$(curl -s $URL | grep -oP '"version"[: ]*"\K[^"]+')" != "$(gem --version)" ]]; then 
        gem update --system
      fi

  ubuntu22_rust:
    type: bash
    cmd: |
      # Skip if already installed - re-provisioning shouldn't re-run this
      # or duplicate the profile lines below on every pass.
      if [ ! -d "$HOME/.cargo" ]; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --no-modify-path
      fi
      mkdir -p "$HOME/.config/powershell"
      source "$HOME/.cargo/env"
  ubuntu22_pyenv:
    type: bash
    cmd: |
      # pyenv.run refuses to run again once $HOME/.pyenv exists
      #  skip entirely instead of catching an error
      if [ ! -d "$HOME/.pyenv" ]; then
        curl https://pyenv.run | bash
      fi

      export PYENV_ROOT="$HOME/.pyenv"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init - bash)"

      # Update List
      pyenv update
  ubuntu22_rbenv:
    type: bash
    cmd: |
      # Ubuntu package issue: 
      #   * rbenv/ruby-build apt packages install to /usr/bin, a completely 
      #     different, incompatible layout than the ~/.rbenv/
      #   * rbenv version list frozen frozen at an April 2020
      #     snapshot (`ruby-build 20200401-1build1`, and only supports 
      #     up to 2.7.1
      sudo apt-get remove -y rbenv ruby-build 2>/dev/null || true

      # rbenv-installer is idempotent and will install fresh or update
      #   rebenv in place under $HOME/.rbenv
      curl -fsSL https://github.com/rbenv/rbenv-installer/raw/HEAD/bin/rbenv-installer | bash

      # ruby-build plugin is installed or updated using git
      if [[ -d "$HOME/.rbenv/plugins/ruby-build" ]]; then
        pushd "$HOME/.rbenv/plugins/ruby-build" && git pull && popd
      else
        git clone https://github.com/rbenv/ruby-build.git "$HOME/.rbenv/plugins/ruby-build"
      fi

      export PATH="$HOME/.rbenv/bin:$PATH"
      eval "$(rbenv init - bash)"
  ubuntu22_cpan_local_setup:
    type: bash
    cmd: |
      #  Force ExtUtils::MakeMaker's own prompt() to silently accept
      #    every default answer instead of blocking on stdin.
      PERL_MM_USE_DEFAULT=1 PERL_MM_OPT="INSTALL_BASE=$HOME/perl5" cpan local::lib

      eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      export PATH=$HOME/perl5/bin:$PATH
  unbuntu22_wsl2_clean:
    type: sh
    cmd: |
      if grep -q "microsoft" /proc/version; then
        CLEAN_PATH="$(echo "$PATH" | tr ':' '\n' | grep -v '/mnt/c/' | tr '\n' ':' | sed 's/:$//')"
        CLEAN_LINE="export PATH=$CLEAN_PATH:/mnt/c/Windows/system32"
        grep -qxF "$CLEAN_LINE" ~/.bashrc 2>/dev/null || printf "\n%s\n" "$CLEAN_LINE" >> ~/.bashrc
        [[ -f $HOME/.zshrc ]] && { grep -qxF "$CLEAN_LINE" ~/.zshrc 2>/dev/null || printf "\n%s\n" "$CLEAN_LINE" >> ~/.zshrc; }
      fi
  ubuntu22_sdkman:
    type: bash
    cmd: |
      # Skip if already installed - see ubuntu22_pyenv's own comment on why.
      if [ ! -d "$HOME/.sdkman" ]; then
        curl -s "https://get.sdkman.io" | bash
        sed -i 's/sdkman_auto_answer=false/sdkman_auto_answer=true/' "$HOME/.sdkman/etc/config"
      fi

      source "$HOME/.sdkman/bin/sdkman-init.sh"
  ubuntu22_asdf:
    type: bash
    cmd: |
      ASDF_VERSION="<%= $asdf_ver %>"
      curl -LO "https://github.com/asdf-vm/asdf/releases/download/${ASDF_VERSION}/asdf-${ASDF_VERSION}-linux-amd64.tar.gz"
      
      tar -xzf "asdf-${ASDF_VERSION}-linux-amd64.tar.gz"
      sudo install -m 755 asdf /usr/local/bin/asdf
      rm "asdf-${ASDF_VERSION}-linux-amd64.tar.gz"

      export PATH="${ASDF_DATA_DIR:-$HOME/.asdf}/shims:$PATH"

      # ZSH Completions
      mkdir -p "${ASDF_DATA_DIR:-$HOME/.asdf}/completions"
      asdf completion zsh > "${ASDF_DATA_DIR:-$HOME/.asdf}/completions/_asdf"
  ubuntu22_rvm:
    type: bash
    cmd: |
      # GPG2 HKP Workround for IPv6
      mkdir -p ~/.gnupg
      chmod 700 ~/.gnupg
      echo 'disable-ipv6' >> ~/.gnupg/dirmngr.conf
      gpgconf --kill dirmngr

      gpg2 \
        --keyserver hkps://keyserver.ubuntu.com \
        --recv-keys \
        409B6B1796C275462A1703113804BB82D39DC0E3 \
        7D2BAF1CF37B13E2069D6956105BD0E739499BDB

      # Stable has up to ruby 3.0; Master will have ruby 4.x
      curl -sSL https://get.rvm.io | bash -s -- --branch master --ignore-dotfiles

      export PATH="$PATH:$HOME/.rvm/bin"
      source "$HOME/.rvm/scripts/rvm"

files:
  ubuntu_default_zshrc:
    dest: $HOME/.zshrc
    content: |
      # Set up the prompt

      autoload -Uz promptinit
      promptinit
      prompt adam1

      setopt histignorealldups sharehistory

      # Use emacs keybindings even if our EDITOR is set to vi
      bindkey -e

      # Keep 1000 lines of history within the shell and save it to ~/.zsh_history:
      HISTSIZE=1000
      SAVEHIST=1000
      HISTFILE=~/.zsh_history

      # Use modern completion system
      autoload -Uz compinit
      compinit

      zstyle ':completion:*' auto-description 'specify: %d'
      zstyle ':completion:*' completer _expand _complete _correct _approximate
      zstyle ':completion:*' format 'Completing %d'
      zstyle ':completion:*' group-name ''
      zstyle ':completion:*' menu select=2
      eval "$(dircolors -b)"
      zstyle ':completion:*:default' list-colors ${(s.:.)LS_COLORS}
      zstyle ':completion:*' list-colors ''
      zstyle ':completion:*' list-prompt %SAt %p: Hit TAB for more, or the character to insert%s
      zstyle ':completion:*' matcher-list '' 'm:{a-z}={A-Z}' 'm:{a-zA-Z}={A-Za-z}' 'r:|[._-]=* r:|=* l:|=*'
      zstyle ':completion:*' menu select=long
      zstyle ':completion:*' select-prompt %SScrolling active: current selection at %p%s
      zstyle ':completion:*' use-compctl false
      zstyle ':completion:*' verbose true

      zstyle ':completion:*:*:kill:*:processes' list-colors '=(#b) #([0-9]#)*=0=01;31'
      zstyle ':completion:*:kill:*' command 'ps -u $USER -o pid,%cpu,tty,cputime,cmd'
  # Construct missing env.ps1 based on pattern in .bashrc/.zshrc
  # Issue:
  #   * Rustup post-install message tells PowerShell users to source
  #     $HOME/.cargo/env.ps1 that doesn't exist
  ubuntu22_rust_ps1:
     dest: $HOME/.cargo/env.ps1
     content: |
       # rustup shell setup
       # affix colons on either side of $env:PATH to simplify matching
       if (":${env:PATH}:" -notlike "*:$HOME/.cargo/bin:*") {
           # Prepending path in case a system-installed rustc needs to be overridden
           $env:PATH = "$HOME/.cargo/bin:$env:PATH"
       }
  ubuntu22_asdf_ps1:
     dest: $HOME/.config/powershell/asdf.ps1
     content: |
       # Determine the location of the shims directory
       if ($null -eq $ASDF_DATA_DIR -or $ASDF_DATA_DIR -eq '') {
         $_asdf_shims = "${env:HOME}/.asdf/shims"
       } 
       else {
         $_asdf_shims = "$ASDF_DATA_DIR/shims"
       }

       # Then add it to path
       $env:PATH = "${_asdf_shims}:${env:PATH}"
       

appends:
  ubuntu22_go:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - export GOPATH=$(go env GOPATH)
      - export PATH=$GOPATH/bin:$PATH
  ubuntu22_sdkman:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - '[[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"'
  ubuntu22_rbenv_bash:
    dest: "$HOME/.bashrc"
    lines:
      - export PATH="$HOME/.rbenv/bin:$PATH"
      - eval "$(rbenv init - bash)"
  ubuntu22_rbenv_zsh:
    dest: "$HOME/.zshrc"
    lines:
      - export PATH="$HOME/.rbenv/bin:$PATH"
      - eval "$(rbenv init - zsh)"
  ubuntu22_pyenv_bash:
    dest: "$HOME/.bashrc"
    lines:
      - export PYENV_ROOT="$HOME/.pyenv"
      - '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"'
      - eval "$(pyenv init - bash)"
  ubuntu22_pyenv_zsh:
    dest: "$HOME/.zshrc"
    lines:
      - export PYENV_ROOT="$HOME/.pyenv"
      - '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"'
      - eval "$(pyenv init - zsh)"
  ubuntu22_rust_shell:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - source "$HOME/.cargo/env"
  ubuntu22_rust_ps1:
    dest: $HOME/.config/powershell/Microsoft.PowerShell_profile.ps1
    lines:
      - . "$HOME/.cargo/env.ps1"
  ubuntu22_coretto_17:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - export JAVA_HOME=$(readlink -f /usr/bin/java | sed 's|/bin/java||')
  ubuntu22_cpan_local_setup:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      - export PATH=$HOME/perl5/bin:$PATH
  ubuntu22_asdf_bash:
    dest: $HOME/.bashrc
    lines:
      - export PATH="${ASDF_DATA_DIR:-$HOME/.asdf}/shims:$PATH"
      - source <(asdf completion bash)
  ubuntu22_asdf_zsh:
    dest: $HOME/.zshrc
    lines:
      - export PATH="${ASDF_DATA_DIR:-$HOME/.asdf}/shims:$PATH"
      - fpath=(${ASDF_DATA_DIR:-$HOME/.asdf}/completions $fpath)
      - autoload -Uz compinit && compinit
  ubuntu22_asdf_ps1:
    dest: $HOME/.config/powershell/Microsoft.PowerShell_profile.ps1
    lines:
       - . "$HOME/.config/powershell/asdf.ps1"
  ubuntu22_rvm:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines: 
      - export PATH="$PATH:$HOME/.rvm/bin"
      - source "$HOME/.rvm/scripts/rvm"


add_apt_repos:
  ubuntu22_corretto:
    name: corretto
    key_url: https://apt.corretto.aws/corretto.key
    repo_uri: https://apt.corretto.aws
    distro_string: stable main
  ubuntu22_docker:
    name: docker
    key_url: https://download.docker.com/linux/ubuntu/gpg
    repo_uri: https://download.docker.com/linux/ubuntu
    distro_string: jammy stable
  ubuntu22_nfpm:
    name: goreleaser
    trusted: yes
    repo_uri: https://repo.goreleaser.com/apt/
    distro_string: "/"
  ubuntu22_script_tut:
    name: script-tut
    key_url: https://darkn3rd.github.io/script-tut/public.asc
    repo_uri: https://darkn3rd.github.io/script-tut
    distro_string: stable main
  ubuntu22_microsoft_prod:
    name: microsoft-prod
    key_url: https://packages.microsoft.com/keys/microsoft.asc
    repo_uri: https://packages.microsoft.com/ubuntu/22.04/prod
    distro_string: "jammy main"
