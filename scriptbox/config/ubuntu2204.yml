ubuntu22:
  global:
    packages:
      - script: ubuntu22_sdkman
      - apt: ['curl','git','make','wget']
    lessons:
      gen_scripts:
        packages:
          - apt:
              - autoconf
              - bison
              - build-essential
              - libbz2-dev
              - libdb-dev
              - libffi-dev
              - libgdbm6
              - libgdbm-dev
              - liblzma-dev
              - libncurses5-dev
              - libncursesw5-dev
              - libreadline6-dev
              - libreadline-dev
              - libsqlite3-dev
              - libssl-dev
              - libxml2-dev
              - libxmlsec1-dev
              - libyaml-dev
              - llvm
              - tk-dev
              - xz-utils
              - zlib1g-dev
          - apt: rbenv
            script: ubuntu22_post_rbenv
          - script: ubuntu22_pyenv
        awk:
          packages:
            - apt: gawk
        groovy:
          packages:
            - sdkman: groovy
              needs: java
        perl:
          packages:
            - system: perl
              meets: perl
              script: ubuntu22_cpan_local_setup
            - cpan: App::cpanminus
            - cpanm: Script
        php:
          packages:
            - apt: php8.1-cli
        python2:
          packages:
            - system: python3 # 3.14.4
            - pyenv: 2.7.18
              cmd: pyenv global 3.10.4 2.7.18
              needs: pyenv3
        python3:
          packages:
            - pyenv: 3.14.6
              cmd: pyenv global 3.10.4
              meets: pyenv3
        ruby:
          packages:
            - rbenv: 4.0.6
              cmd: rbenv global 4.0.6
        tcl:
          packages:
            - apt: tcl
      shell_scripts:
        bash:
            packages: 
              - system: bash
        csh:
            packages: 
              - apt: tcsh
        ksh:
            packages: 
              - apt: ksh93u+m
        posix:
            packages: 
              - system: dash
              - needs: perl
        zsh:
            packages:
            - apt: zsh
      compiled_lang:
        packages:
          - apt: curl
          - apt: build-essential
            meets: make
        cs:
          packages:
            - apt: dotnet-sdk-10.0
        java:
          packages:
            - apt: openjdk-17-jdk
              meets: java
        go:
          packages:
            - apt: golang-go
        rust:
          packages:
            - script: ubuntu22_rust
      win_scripts:
        powershell:
          packages:
            - script: ubuntu22_powershell
    cibox:
    testbox:
      packages:
        - script: ubuntu22_powershell
        - rbenv: 4.0.6
scripts:
  ubuntu22_rust:
    type: bash
    cmd: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --no-modify-path
      echo 'source "$HOME/.cargo/env"' >> ~/.bashrc
      [[ -f $HOME/.zshrc ]] && echo 'source "$HOME/.cargo/env' >> ~/.zshrc

      # PowerShell 
      mkdir -p "$HOME/.config/powershell"
      printf '. "$HOME/.cargo/env.ps1"\n' >> "$HOME/.config/powershell/Microsoft.PowerShell_profile.ps1"

      source ~/.bashrc
  ubuntu22_powershell:
    type: bash
    cmd: |
      wget -q https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
      sudo dpkg -i packages-microsoft-prod.deb
      rm packages-microsoft-prod.deb
      
      # Add Microsoft packages list
      sudo apt-get update

      # Install PowerShell 7.x (pwsh)
      sudo apt-get install -y powershell
  ubuntu22_pyenv:
    type: bash
    cmd: |
      # Install Pyenv
      curl https://pyenv.run | bash 

      # Profile Setup
      echo 'export PYENV_ROOT="$HOME/.pyenv"' >> ~/.bashrc
      echo 'command -v pyenv >/dev/null || export PATH="$PATH:$PYENV_ROOT/bin"' >> ~/.bashrc
      echo 'eval "$(pyenv init -)"' >> ~/.bashrc
      source ~/.bashrc

      # Update List
      pyenv update
  ubuntu22_post_rbenv:
     type: bash
     cmd: |
      # Profile Setup
      echo 'export PATH="$HOME/.rbenv/bin:$PATH"' >> ~/.bashrc
      echo 'eval "$(rbenv init -)"' >> ~/.bashrc
      source ~/.bashrc

      # Update List
      pushd $HOME/.rbenv/plugins/ruby-build  && git pull && popd
  ubuntu22_go:
    type: bash
    cmd: |
      sudo add-apt-repository -y ppa:longsleep/golang-backports
      sudo apt update && sudo apt install -y golang-go
      
      echo 'export GOPATH=$(go env GOPATH)' >> ~/.bashrc
      echo 'export PATH=$GOPATH/bin:$PATH' >> ~/.bashrc
      source ~/.bashrc
  ubuntu22_cpan_local_setup:
      type: bash
      cmd: |
        PERL_MM_OPT="INSTALL_BASE=$HOME/perl5" cpan local::lib
        echo 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' >> ~/.bashrc
        source ~/.bashrc

  ubuntu22_coretto_17:
      type: bash
      cmd:  |
        KEYRING="/usr/share/keyrings/corretto-keyring.gpg"
        wget -O - https://apt.corretto.aws/corretto.key \
          | sudo gpg --dearmor -o $KEYRING --yes
        echo "deb [signed-by=$KEYRING] https://apt.corretto.aws stable main" \
          | sudo tee /etc/apt/sources.list.d/corretto.list
        sudo apt update && sudo apt install -y java-17-amazon-corretto-jdk

        echo "export JAVA_HOME=\$(readlink -f /usr/bin/java | sed 's|/bin/java||')" >> ~/.bashrc
        source ~/.bashrc    