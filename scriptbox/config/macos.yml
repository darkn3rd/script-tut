macos:
  global:
    packages:
      - script: macos_xcode_cli_tools
      - script: macos_homebrew
    lessons:
      gen_scripts:
        awk:
          packages:
            - brew: gawk
        groovy:
          packages:
            - brew: groovy
              needs: java
        perl:
          packages:
            - system: perl
            - brew: perl
              meets: perl
              script: macos_cpan_local_setup
            - cpan: App::cpanminus
            - cpanm: Switch
        php:
          packages:
            - brew: php
        python3:
          packages:
            - brew: python3
        ruby:
          packages:
            - brew: ruby
        tcl:
          packages:
            - brew: tcl-tk
      shell_scripts:
        packages: 
            - brew: bc
            - brew: getopt
        bash:
            packages: 
              - brew: bash
                script: macos_setup_homebrew_bash
        csh:
            packages: 
              - brew: tcsh
        ksh:
            packages: 
              - brew: ksh
        posix:
            packages:
              - brew: dash-shell
                needs: perl
        zsh:
            packages:
            - brew: zsh
              script: macos_setup_homebrew_zsh
      compiled_lang:
        cs:
          packages:
            - cask: dotnet-sdk
        go:
          packages:
            - brew: go
        java:
          packages:
            - tap: homebrew/cask-versions
            - cask: corretto@17
              meets: java
              script: macos_java_17_home
        rust:
          packages:
            - brew: rust
      win_scripts:
        packages:
          - cask: wine-stable
            script: macos_wine_fix
          - brew: winetricks
            script: macos_winetricks_wsh57
          - script: macos_wine_coreutils
        powershell:
          packages:
            - brew: powershell
    cibox:
      packages: 
        - brew: act
        - brew: colima
        - brew: docker
    testbox:
      packages:
        - brew: powershell
        - brew: ruby
scripts:
  macos_homebrew:
    type: bash
    cmd: |
      script_url="https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
      /bin/bash -c "$(curl -fsSL "$script_url")"

      # Applied before the PATH check below, not after - Homebrew's own
      #  installer does not add itself to the *current* process's PATH, and
      #  on Apple Silicon (/opt/homebrew) unlike Intel (/usr/local) that
      #  directory isn't on the default PATH either way, so `command -v
      #  brew` would otherwise fail here even on a successful install.
      eval "$(brew --prefix)/bin/brew shellenv"

      if ! command -v brew >/dev/null 2>&1; then
        echo "macos_homebrew: brew not found on PATH after install - stopping" >&2
        exit 1
      fi

      grep -qxF 'eval "$(brew --prefix)/bin/brew shellenv"' ~/.bashrc 2>/dev/null || echo 'eval "$(brew --prefix)/bin/brew shellenv"' >> ~/.bashrc
      grep -qxF 'eval "$(brew --prefix)/bin/brew shellenv"' ~/.zshrc 2>/dev/null || echo 'eval "$(brew --prefix)/bin/brew shellenv"' >> ~/.zshrc
  macos_cpan_local_setup:
    type: bash
    cmd: |
      #  Force ExtUtils::MakeMaker's own prompt() to silently accept
      #    every default answer instead of blocking on stdin.
      PERL_MM_USE_DEFAULT=1 PERL_MM_OPT="INSTALL_BASE=$HOME/perl5" cpan local::lib
      grep -qxF 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' ~/.bashrc 2>/dev/null || echo 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' >> ~/.bashrc
      grep -qxF 'export PATH=$HOME/perl5/bin:$PATH' ~/.bashrc 2>/dev/null || echo 'export PATH=$HOME/perl5/bin:$PATH' >> ~/.bashrc
      grep -qxF 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' ~/.zshrc 2>/dev/null || echo 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' >> ~/.zshrc
      grep -qxF 'export PATH=$HOME/perl5/bin:$PATH' ~/.zshrc 2>/dev/null || echo 'export PATH=$HOME/perl5/bin:$PATH' >> ~/.zshrc

      # Direct, not `source ~/.bashrc` - a script run non-interactively
      # (any provisioner, or even a human running this file with `bash
      # script.sh`) hits nearly every default .bashrc's own "return if
      # not interactive" guard before ever reaching the lines just
      # appended above, so they'd never take effect in this process -
      # and the very next steps in this same script (cpan:
      # App::cpanminus, cpanm: Switch) need cpanm on PATH already.
      eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      export PATH=$HOME/perl5/bin:$PATH
  macos_wine_fix:
    type: bash
    cmd: |
      ln -s "/Applications/Wine Stable.app/Contents/Resources/wine/share/wine" /usr/local/share/wine
      ln -s "/Applications/Wine Stable.app/Contents/Resources/wine/lib/wine" /usr/local/lib/wine
      grep -qxF 'export MVK_CONFIG_LOG_LEVEL=0' ~/.bashrc 2>/dev/null || echo 'export MVK_CONFIG_LOG_LEVEL=0' >> ~/.bashrc
      grep -qxF 'export WINEDEBUG=-all' ~/.bashrc 2>/dev/null || echo 'export WINEDEBUG=-all' >> ~/.bashrc
      grep -qxF 'export MVK_CONFIG_LOG_LEVEL=0' ~/.zshrc 2>/dev/null || echo 'export MVK_CONFIG_LOG_LEVEL=0' >> ~/.zshrc
      grep -qxF 'export WINEDEBUG=-all' ~/.zshrc 2>/dev/null || echo 'export WINEDEBUG=-all' >> ~/.zshrc

      # Applied immediately too - macos_winetricks_wsh57 runs wine-based
      #  commands later in this same script and benefits from the
      #  quieter debug output just as much as a future session would.
      export MVK_CONFIG_LOG_LEVEL=0
      export WINEDEBUG=-all
  macos_setup_homebrew_bash:
    type: bash
    cmd: |
      grep -qxF "$(brew --prefix)/bin/bash" /etc/shells 2>/dev/null || echo "$(brew --prefix)/bin/bash" | sudo tee -a /etc/shells
  macos_setup_homebrew_zsh:
    type: bash
    cmd: |
      grep -qxF "$(brew --prefix)/bin/zsh" /etc/shells 2>/dev/null || echo "$(brew --prefix)/bin/zsh" | sudo tee -a /etc/shells
  macos_xcode_cli_tools:
    type: bash
    cmd: |
      touch /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
      label=$(softwareupdate -l 2>&1 \
        | grep -B1 -E 'Command Line Tools' \
        | awk -F'\* Label: ' '{print $2}' \
        | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
        | head -1)
      sudo softwareupdate -i "$label" --agree-to-license --verbose
      rm -f /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
  macos_java_17_home:
    type: bash
    cmd: |
      grep -qxF 'export JAVA_HOME=$(/usr/libexec/java_home -v 17)' ~/.bashrc 2>/dev/null || echo 'export JAVA_HOME=$(/usr/libexec/java_home -v 17)' >> ~/.bashrc
      grep -qxF 'export PATH=$JAVA_HOME/bin:$PATH' ~/.bashrc 2>/dev/null || echo 'export PATH=$JAVA_HOME/bin:$PATH' >> ~/.bashrc
      grep -qxF 'export JAVA_HOME=$(/usr/libexec/java_home -v 17)' ~/.zshrc 2>/dev/null || echo 'export JAVA_HOME=$(/usr/libexec/java_home -v 17)' >> ~/.zshrc
      grep -qxF 'export PATH=$JAVA_HOME/bin:$PATH' ~/.zshrc 2>/dev/null || echo 'export PATH=$JAVA_HOME/bin:$PATH' >> ~/.zshrc

      # Applied immediately too - groovy (needs: java) installs right
      #  after this in the same script and needs java on PATH already.
      export JAVA_HOME=$(/usr/libexec/java_home -v 17)
      export PATH=$JAVA_HOME/bin:$PATH
  macos_winetricks_wsh57:
    type: bash
    cmd: |
      winetricks wsh57

      WINE_APP_STUBS="/Applications/Wine Stable.app/Contents/Resources/wine/lib/wine/x86_64-windows"
      SYS32="$HOME/.wine/drive_c/windows/system32"
      SYSWOW64="$HOME/.wine/drive_c/windows/syswow64"

      cp "${SYSWOW64}/cscript.exe" "${SYS32}/cscript.exe"
      cp "${SYSWOW64}/wscript.exe" "${SYS32}/wscript.exe"
  macos_wine_coreutils:
    type: bash
    cmd: |
        pushd $HOME/Downloads

        # Download coreutils
        curl -LO https://github.com/microsoft/coreutils/releases/download/v2026.6.16/coreutils-2026.6.16-x64.exe
        
        # Verify checksum
        ACTUAL_SHA=$(shasum -a 256 coreutils-2026.6.16-x64.exe | cut -f1 -d' ')
        EXPECTED_SHA="f862b1aa433310420ae20f9b1384f3f974a26ba98ae37ac548061116a3ef6c62"
        
        if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
          echo "ERROR: CHECKSUM MISMATCH - DO NOT USE THIS FILE" >&2
          exit 1
        fi
        echo "CHECKSUM OK"
        
        # install coreutils 
        wine coreutils-2026.6.16-x64.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
        
        popd


    

