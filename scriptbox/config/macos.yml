macos:
  variables:
    brew_prefix: "<%= RbConfig::CONFIG['host_cpu'] == 'x86_64' ? '/usr/local' : '/opt/homebrew' %>"
  global:
    packages:
      - script: macos_rosetta
      - script: macos_xcode_cli_tools
      - script: macos_homebrew
      - append: macos_homebrew_zsh
      - append: macos_homebrew_bash
    lessons:
      gen_scripts:
        awk:
          packages:
            - brew: gawk
              append: macos_brew_gawk
        groovy:
          packages:
            - brew: groovy
              needs: java
        perl:
          packages:
            - system: perl
            - brew: perl
              meets: perl
              script: macos_cpan_local_setup
              append: macos_cpan_local_setup
            - cpan: App::cpanminus
            - cpanm: Switch
        php:
          packages:
            - brew: php
        python3:
          packages:
            - brew: python3
        ruby:
          packages:
            - brew: ruby
        tcl:
          packages:
            - brew: tcl-tk
      shell_scripts:
        packages: 
            - brew: bc
              append: macos_brew_bc
            - brew: gnu-getopt
              append: macos_brew_gnu-getopt
        bash:
            packages: 
              - brew: bash
                append: macos_setup_homebrew_bash
        csh:
            packages: 
              - brew: tcsh
        ksh:
            packages: 
              - brew: ksh
        posix:
            packages:
              - brew: dash-shell
                needs: perl
        zsh:
            packages:
            - brew: zsh
              append: macos_setup_homebrew_zsh
      compiled_lang:
        cs:
          packages:
            - cask: dotnet-sdk
        go:
          packages:
            - brew: go
        java:
          packages:
            - tap: homebrew/cask-versions
            - cask: corretto@17
              meets: java
              script: macos_java_17_home
              append: macos_java_17_home
        rust:
          packages:
            - brew: rust
      win_scripts:
        packages:
          - cask: wine-stable
            script: macos_wine_fix
          - brew: winetricks
            script: macos_winetricks_wsh57
          - script: macos_wine_coreutils
        powershell:
          packages:
            - brew: powershell
    cibox:
      packages: 
        - brew: act
        - brew: colima
        - brew: docker
    testbox:
      packages:
        - brew: powershell
        - brew: ruby
scripts:
  macos_rosetta:
    type: bash
    cmd: |
      [[ "$(uname -m)" == "arm64" ]] && sudo softwareupdate --install-rosetta --agree-to-license

  macos_homebrew:
    type: bash
    cmd: |
      script_url="https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
      /bin/bash -c "$(curl -fsSL "$script_url")"

      # Bootstrap Homebrew into existing environment
      BREWCMD="/usr/local/bin/brew"
      [[ "$(uname -m)" == "arm64" ]] && BREWCMD="/opt/homebrew/bin/brew"
      eval "$($BREWCMD shellenv zsh)"

      if ! command -v brew >/dev/null 2>&1; then
        echo "macos_homebrew: brew not found on PATH after install - stopping" >&2
        exit 1
      fi
  macos_cpan_local_setup:
    type: bash
    cmd: |
      #  Force ExtUtils::MakeMaker's own prompt() to silently accept
      #    every default answer instead of blocking on stdin.
      PERL_MM_USE_DEFAULT=1 PERL_MM_OPT="INSTALL_BASE=$HOME/perl5" cpan local::lib

      eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      export PATH=$HOME/perl5/bin:$PATH
  macos_wine_fix:
    type: bash
    cmd: |
      ln -s "/Applications/Wine Stable.app/Contents/Resources/wine/share/wine" /usr/local/share/wine
      ln -s "/Applications/Wine Stable.app/Contents/Resources/wine/lib/wine" /usr/local/lib/wine

      # macos_winetricks_wsh57 runs wine-basedvcommands later in this same script and benefits from the
      #  quieter debug output just as much as a future session would.
      export MVK_CONFIG_LOG_LEVEL=0
      export WINEDEBUG=-all
  macos_xcode_cli_tools:
    type: bash
    cmd: |
      # Run interactive GUI installer 
      # CLT packages now appear in list with sfotwareupdate -l
      xcode-select --install

      # new packages available 
      CLT_LABEL=$(
        softwareupdate -l 2>&1 |
        awk -F': ' '
        /Label: Command Line Tools/ {
            label = $2
            version = label
            sub(/^Command Line Tools for Xcode /, "", version)
            sub(/-.*/, "", version)

            if (version + 0 > max) {
                max = version + 0
                newest = label
            }
        }
        END {
            print newest
        }'
      )

      sudo softwareupdate --install "$CLT_LABEL"
  macos_java_17_home:
    type: bash
    cmd: |
      export JAVA_HOME=$(/usr/libexec/java_home -v 17)
      export PATH=$JAVA_HOME/bin:$PATH
  macos_winetricks_wsh57:
    type: bash
    cmd: |
      winetricks wsh57

      WINE_APP_STUBS="/Applications/Wine Stable.app/Contents/Resources/wine/lib/wine/x86_64-windows"
      SYS32="$HOME/.wine/drive_c/windows/system32"
      SYSWOW64="$HOME/.wine/drive_c/windows/syswow64"

      cp "${SYSWOW64}/cscript.exe" "${SYS32}/cscript.exe"
      cp "${SYSWOW64}/wscript.exe" "${SYS32}/wscript.exe"
  macos_wine_coreutils:
    type: bash
    cmd: |
      pushd $HOME/Downloads

      # Download coreutils
      curl -LO https://github.com/microsoft/coreutils/releases/download/v2026.6.16/coreutils-2026.6.16-x64.exe
      
      # Verify checksum
      ACTUAL_SHA=$(shasum -a 256 coreutils-2026.6.16-x64.exe | cut -f1 -d' ')
      EXPECTED_SHA="f862b1aa433310420ae20f9b1384f3f974a26ba98ae37ac548061116a3ef6c62"
      
      if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
        echo "ERROR: CHECKSUM MISMATCH - DO NOT USE THIS FILE" >&2
        exit 1
      fi
      echo "CHECKSUM OK"
      
      # install coreutils 
      wine coreutils-2026.6.16-x64.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
      
      popd
appends:
  # Configure Brew CLI for default zsh
  macos_homebrew_zsh:
    dest: $HOME/.zprofile
    lines:
      - eval "$(<%= $brew_prefix %>/bin/brew shellenv zsh)"
  # Configure Brew CLI for default bash
  macos_homebrew_bash:
    dest: $HOME/.bash_profile
    lines:
      - eval "$(<%= $brew_prefix %>/bin/brew shellenv bash)"
  macos_setup_homebrew_bash:
    dest: /etc/shells
    lines:
      - <%= $brew_prefix %>/bin/bash
  macos_setup_homebrew_zsh:
    dest: /etc/shells
    lines:
      - <%= $brew_prefix %>/bin/zsh
  macos_java_17_home:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - export JAVA_HOME=$(/usr/libexec/java_home -v 17)
      - export PATH=$JAVA_HOME/bin:$PATH
  macos_cpan_local_setup:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      - export PATH=$HOME/perl5/bin:$PATH
  macos_wine_fix:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - export MVK_CONFIG_LOG_LEVEL=0
      - export WINEDEBUG=-all
  macos_brew_gawk:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - PATH="<%= $brew_prefix %>/opt/gawk/libexec/gnubin:$PATH"
  macos_brew_bc:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - PATH="<%= $brew_prefix %>/opt/bc/bin:$PATH"
  macos_brew_gnu-getopt:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - PATH="<%= $brew_prefix %>/opt/gnu-getopt/bin:$PATH"


