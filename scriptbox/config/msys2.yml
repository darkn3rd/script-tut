msys2:
  global:
    packages:
      - pacman: vim
        append: msys2_vi_alias
      - file: msys2_default_zshrc
      - append: msys2_purge_windows_path
        script: msys2_purge_windows_path
      # Ruby required for lessons.gen_scripts, scriptbox, and testbox
      - pacman: mingw-w64-ucrt-x86_64-ruby
      # PowerShell required for lessons.win_scripts, scriptbox, and testbox
      #  Configuration will depend on Windows installation
      - path: /c/Windows/System32/WindowsPowerShell/v1.0/
    lessons:
      gen_scripts:
        awk:
          packages:
            - pacman: gawk
        groovy:
          packages:
            - append: msys2_groovy_path
        perl:
          packages:
            - pacman: perl
              meets: perl
            - script: msys2_cpan_local_setup
              append: 
                - msys2_cpan_local_setup_bash
                - msys2_cpan_local_setup_zsh
              needs: make
            - cpan: App::cpanminus
            - cpanm: Switch
        python3:
          packages:
            - pacman: mingw-w64-ucrt-x86_64-python
        php:
          packages:
            - path: /c/tools/php85/
        tcl:
          packages:
            - pacman: mingw-w64-ucrt-x86_64-tcl
      shell_scripts:
        packages:
          - pacman: bc
        csh:
          packages:
            - pacman: tcsh
        posix:
          packages:
            - pacman: dash
              needs: perl
        zsh:
          packages:
            - pacman: zsh
      compiled_lang:
        packages:
          - pacman: base-devel
            meets: make
          - pacman: mingw-w64-x86_64-toolchain
        cs:
          packages:
            - path: /c/Program Files/dotnet/
        go:
          packages:
            - pacman: mingw-w64-ucrt-x86_64-go
        java:
          packages:
            - append: msys2_corretto_path
        rust:
          packages:
            - pacman: mingw-w64-ucrt-x86_64-rust
      win_scripts:
          batch:
            packages:
              - path: /c/Windows/System32/
    testbox:
    scriptbox:
      packages:
        - script: msys2_update_gems
        - gem: ratatui_ruby
scripts:
  msys2_purge_windows_path:
    type: bash
    # Create POSIX-only base PATH and only Windows tools we deliberately 
    #  add on a case-by-case basis. 
    cmd: |
      export PATH=$(echo "$PATH" | tr ':' '\n' | grep -vE '^/[a-zA-Z]/' | paste -sd ':')
  msys2_update_gems:
    type: bash
    cmd: |
      URL="https://rubygems.org/api/v1/versions/rubygems-update/latest.json"
      if [[ "$(curl -s $URL | grep -oP '"version"[: ]*"\K[^"]+')" != "$(gem --version)" ]]; then 
        gem update --system
      fi
  msys2_cpan_local_setup:
    type: bash
    cmd: |
      #  Force ExtUtils::MakeMaker's own prompt() to silently accept
      #    every default answer instead of blocking on stdin.
      PERL_MM_USE_DEFAULT=1 PERL_MM_OPT="INSTALL_BASE=$HOME/perl5" cpan local::lib

      export SHELL=/usr/bin/bash
      eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      export PATH=$HOME/perl5/bin:$PATH
appends:
  msys2_cpan_local_setup_bash:
    dest: "$HOME/.bashrc"
    lines:
      # SHELL required for local::lib on Windows
      #   local::lib emits Windows batch syntax if not specified
      #   See: https://github.com/Perl-Toolchain-Gang/local-lib/issues/15
      - export SHELL=/usr/bin/bash
      - eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      - export PATH=$HOME/perl5/bin:$PATH
  msys2_cpan_local_setup_zsh:
    dest: "$HOME/.zshrc"
    lines:
      # SHELL required for local::lib on Windows
      #   local::lib emits Windows batch syntax if not specified
      #   See: https://github.com/Perl-Toolchain-Gang/local-lib/issues/15
      - export SHELL=/usr/bin/zsh
      - eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      - export PATH=$HOME/perl5/bin:$PATH
  # Detect Windows Groovy versioned path and append to PATH
  msys2_groovy_path:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - GROOVY_BIN=$(ls -d "/c/tools/groovy-"*"/bin" 2>/dev/null | sort -V | tail -1)
      - '[[ -d "$GROOVY_BIN" ]] && export PATH="$GROOVY_BIN:$PATH"'
  # Detect Windows Corretto JDK versioned path and append to PATH
  msys2_corretto_path:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - CORRETTO_BIN=$(ls -d "/c/Program Files/Amazon Corretto/jdk17."*"/bin" 2>/dev/null | sort -V | tail -1)
      - '[[ -d "$CORRETTO_BIN" ]] && export PATH="$CORRETTO_BIN:$PATH"'
  msys2_purge_windows_path:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - export PATH=$(echo "$PATH" | tr ':' '\n' | grep -vE '^/[a-zA-Z]/' | paste -sd ':')
  msys2_vi_alias:
    dest: ["$HOME/.bashrc", "$HOME/.zshrc"]
    lines:
      - alias vi='vim'"
files:
  msys2_default_zshrc:
    dest: $HOME/.zshrc
    content: |
      # settings from zsh-newuser-install 
      HISTFILE=~/.histfile
      HISTSIZE=1000
      SAVEHIST=1000
      setopt beep extendedglob nomatch
      unsetopt autocd
      bindkey -v
      
      # settings from compinstall
      autoload -Uz compinit
      compinit
