msys2:
  global:
    lessons:
      gen_scripts:
        awk:
          packages:
            - pacman: gawk
        perl:
          packages:
            - pacman: perl
              meets: perl
            - script: msys2_cpan_local_setup
              needs: make
            - cpan: App::cpanminus
            - cpanm: Switch
        python3:
          packages:
            - pacman: mingw-w64-ucrt-x86_64-python
        php:
          packages:
            - path: /c/tools/php85/
        ruby:
          packages:
            - pacman: mingw-w64-ucrt-x86_64-ruby
        tcl:
          packages:
            - pacman: mingw-w64-ucrt-x86_64-tcl
      shell_scripts:
        packages:
          - pacman: bc
        csh:
          packages:
            - pacman: tcsh
        posix:
          packages:
            - pacman: dash
              needs: perl
        zsh:
          packages:
            - pacman: zsh
      compiled_lang:
        packages:
          - pacman: base-devel
            meets: make
          - pacman: mingw-w64-x86_64-toolchain
        cs:
          packages:
            - path: /c/Program Files/dotnet/
        go:
          packages:
            - pacman: mingw-w64-ucrt-x86_64-go
        java:
          packages:
            - path:  /c/Program Files/Amazon Corretto/jdk17.0.19_10/bin/
        rust:
          packages:
            - pacman: mingw-w64-ucrt-x86_64-rust
      win_scripts:
          batch:
            packages:
              - path: /c/Windows/System32/
          powershell:
            packages:
              - path: /c/Windows/System32/WindowsPowerShell/v1.0/
    testbox:
      packages:
        - pacman: mingw-w64-ucrt-x86_64-ruby
    scriptbox:
      packages:
        - pacman: mingw-w64-ucrt-x86_64-ruby
        - script: msys2_update_gems
        - gem: ratatui_ruby
scripts:
  msys2_update_gems:
    type: bash
    cmd: gem update --system
  msys2_cpan_local_setup:
    type: bash
    cmd: |
      #  Force ExtUtils::MakeMaker's own prompt() to silently accept
      #    every default answer instead of blocking on stdin.
      PERL_MM_USE_DEFAULT=1 PERL_MM_OPT="INSTALL_BASE=$HOME/perl5" cpan local::lib
      echo 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' >> ~/.bashrc
      echo 'export PATH=$HOME/perl5/bin:$PATH' >> ~/.bashrc
      if [[ -f $HOME/.zshrc ]]; then
        echo 'eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"' >> ~/.zshrc
        echo 'export PATH=$HOME/perl5/bin:$PATH' >> ~/.zshrc
      fi

      eval "$(perl -I$HOME/perl5/lib/perl5 -Mlocal::lib=$HOME/perl5)"
      export PATH=$HOME/perl5/bin:$PATH
