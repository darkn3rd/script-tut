# Environment (uname -r): MINGW64_NT-10.0-26200, CYGWIN_NT-10.0-26200, Linux, Darwin
# Distro (awk -F'"' '/^NAME/{print $2}' /etc/os-release): Ubuntu
# Distro Verrsion ( awk -F'"' '/^VERSION_ID/{print $2}' /etc/os-release): 22.04
environments:
  - platform: windows
    supports: 
      - windows_nt.10_0_26200
  - platform: macOS
    supports: 
      - darwin.25_5_0
      - darwin.25_6_0
  - platform: ubuntu26
    supports:
      - linux_ubuntu.26_04
    lineage: debian
  - platform: ubuntu22
    supports:
      - linux_ubuntu.22_04
      - linux_pop.22_04
    lineage: debian
  - platform: cygwin
    supports: 
      - cygwin_nt.10_0_26200
  - platform: msys2
    supports: 
      - mingw64_nt.10_0_26200
