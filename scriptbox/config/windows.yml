windows:
  shell: powershell
  global:
    packages:
      - script: windows_chocolatey
      - script: windows_fix_ssh_home
      - choco: gsudo
      - choco: make
      # Ruby required for lessons.gen_scripts, scriptbox, testbox
      - choco: ruby
      # Powershell requried for lessons.win_scripts, scriptbox, testbox
      - choco: powershell-core
    lessons:
      gen_scripts:
        awk:
          packages:
            - choco: gawk
        groovy:
          packages:
            - choco: groovy
              needs: java
        perl:
          packages:
            - choco: strawberryperl
              meets: perl
        php:
          packages:
            - choco: php
        python2:
          packages:
            - choco: python2
              script: windows_python2
        python3:
          packages:
            - choco: python3
              script: windows_python3
        tcl:
          packages:
            - choco: magicsplat-tcl-tk
      shell_scripts:
        packages: 
          - choco: cygwin
          - choco: cyg-get
          - choco_cyg: wget
          - choco: apt-cyg
          - choco: msys2
      compiled_lang:
        cs:
          packages:
            - choco: dotnet-sdk
        go:
          packages:
            - choco: go
        java:
          packages:
            - choco: corretto17jdk
              meets: java
        rust:
          packages:
            - choco: rust
      win_scripts:
        packages:
          - choco: mscoreutils
    cibox:
      packages:
        - feature: Microsoft-Windows-Subsystem-Linux
          reboot: no
        - feature: VirtualMachinePlatform
          reboot: yes
        - choco: docker-desktop
        - choco: act-cli
    testbox:
      packages:
        - script: windows_psake
    scriptbox:
      packages:
        - script: windows_update_gems
        - gem: ratatui_ruby    
scripts:
  windows_chocolatey:
    type: powershell
    elevated: true
    cmd: |
      # Some boxes (confirmed on gusztavvargadr/windows-11) inject
      # HOME=%USERPROFILE% fresh into every process, outside the normal
      # User/Machine env var scopes. Cleared before anything installs,
      # not just before our own later msys2/cygwin steps - choco's own
      # msys2/cygwin packages can invoke bash internally during install
      # (MSYS2's first-run filesystem bootstrap, Cygwin's postinstall.sh
      # scripts), and either would silently inherit the wrong HOME and
      # bootstrap the user's home directory in the wrong place before we
      # ever get a chance to fix it ourselves.
      Remove-Item Env:\HOME -ErrorAction SilentlyContinue
      Set-ExecutionPolicy Bypass -Scope Process -Force
      [System.Net.ServicePointManager]::SecurityProtocol = `
        [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
      $WebClient = New-Object System.Net.WebClient
      $ScriptUrl = 'https://community.chocolatey.org/install.ps1'
      Invoke-Expression ($WebClient.DownloadString($ScriptUrl))
  windows_fix_ssh_home:
    type: powershell
    elevated: true
    cmd: |
      # `vagrant ssh` lands in cmd.exe with HOME already set to
      # %USERPROFILE% (same injected value seen in every process on this
      # box - see windows_chocolatey's own comment). cmd.exe's AutoRun key
      # runs automatically at the start of every new cmd.exe session,
      # including ones reached over SSH, so clearing HOME there makes an
      # interactive `vagrant ssh` session behave the same as provisioning
      # (which clears it directly) without requiring it to be done by hand
      # each time.
      New-Item -Path 'HKCU:\Software\Microsoft\Command Processor' -Force | Out-Null
      Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Command Processor' -Name 'AutoRun' -Value 'set HOME='
  windows_gsudo_config:
    type: powershell
    elevated: true
    cmd: gsudo config CacheMode Auto
  windows_update_gems:
    type: powershell
    elevated: true
    cmd: |
      $URL = "https://rubygems.org/api/v1/versions/rubygems-update/latest.json"
      $LatestVersion = (Invoke-RestMethod -Uri $URL).version
      $CurrentVersion = (gem --version).Trim()
      if ($LatestVersion -ne $CurrentVersion) {
        gem update --system
      }
  windows_python2:
    type: powershell
    elevated: true
    cmd: |
      Copy-Item "C:\Python27\python.exe" "C:\Python27\python2.exe"
      Copy-Item "C:\Python27\pythonw.exe" "C:\Python27\python2w.exe"

      $sysPath = [Environment]::GetEnvironmentVariable("PATH", "Machine") -split ';' `
        | Where-Object { $_ -ne '' }
      $python2Entries = $sysPath | Where-Object { $_ -like '*Python27*' }
      $otherEntries   = $sysPath | Where-Object { $_ -notlike '*Python27*' }
      $newPath = ($otherEntries + $python2Entries) -join ';'
      [Environment]::SetEnvironmentVariable("PATH", $newPath, "Machine")
  windows_python3:
    type: powershell
    elevated: true
    cmd: |
      Copy-Item "C:\Python314\python.exe" "C:\Python314\python3.exe"
      Copy-Item "C:\Python314\pythonw.exe" "C:\Python314\python3w.exe"
  windows_psake:
    type: powershell
    elevated: true
    cmd: |
      Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
      Install-Module -Name psake -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      # Under an elevated session, Install-Module -Scope CurrentUser has
      #  been observed writing into the Windows PowerShell 5.1-style
      #  modules directory instead of PowerShell Core's own, even when
      #  $PSVersionTable.PSEdition is genuinely 'Core' - confirmed
      #  directly (module files present, manifest valid, yet
      #  undiscoverable via Get-Module -ListAvailable from pwsh, in
      #  either the same session or a brand new one). Copy it into
      #  Core's own modules directory explicitly so it's discoverable
      #  regardless of which PowerShellGet actually handled the install.
      $corePSModules = Join-Path $HOME 'Documents\PowerShell\Modules'
      $winPSakeModule = Join-Path $HOME 'Documents\WindowsPowerShell\Modules\psake'
      if ((Test-Path $winPSakeModule) -and -not (Test-Path (Join-Path $corePSModules 'psake'))) {
        New-Item -ItemType Directory -Path $corePSModules -Force | Out-Null
        Copy-Item -Path $winPSakeModule -Destination $corePSModules -Recurse -Force
      }