# modulepath - ../shared_modules (the classifier-agnostic lessons
#  module, shared by all three classifier trees - see its own
#  manifests/init.pp) plus ../.forge-vendor (puppetlabs-stdlib,
#  vendored - see its own .gitkeep and the root .gitignore) -
#  ensure_packages/ensure_resource/any2array/dirname/file_line all come
#  from there, same reason Chef vendors into .berks-vendor/ and Ansible
#  into .galaxy-vendor/.
modulepath = ../shared_modules:../.forge-vendor
