---
version: 5

defaults:
  datadir: data
  data_hash: yaml_data

hierarchy:
  # Hand-written knobs (lessons::user, the four area gates) - never
  #  touched by scriptbox/scripts/generate_puppet.rb, same as Chef's
  #  own attributes/default.rb or Ansible's own defaults/main.yml.
  - name: 'Common defaults'
    path: 'common.yaml'

  # GENERATED by scriptbox/scripts/generate_puppet.rb --classifier
  #  hiera (see ../../../scriptbox/scripts/generate_puppet.rb). Static
  #  path, not %{facts.os.distro.codename}-interpolated - only ubuntu22
  #  has a generated entry today, same single-platform scope the Chef
  #  cookbook and Ansible role this mirrors currently cover. Once a
  #  second platform exists, switch this to a real interpolated path
  #  (keyed off a fact, or off parameters an ENC handed in - see
  #  ../enc/node_classifier.rb for that same platform-to-data mapping
  #  problem solved the other classifier's way) and drop the static one.
  - name: 'Lessons data (ubuntu22)'
    path: 'lessons/ubuntu22.yaml'
