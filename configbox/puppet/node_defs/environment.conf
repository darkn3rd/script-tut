# manifest - a colon-separated list, glob-expanded: site.pp first (the
#  fallback `node default` below), then every GENERATED per-platform
#  node file under manifests/nodes/ (see scriptbox/scripts/
#  generate_puppet.rb --classifier site) - each one already contains
#  its own literal `node '<platform>' { ... }` block, so nothing here
#  needs to reference them by name individually.
manifest = manifests/site.pp:manifests/nodes/*.pp

# ../shared_modules (the classifier-agnostic lessons module, shared by
#  all three classifier trees - see its own manifests/init.pp) plus
#  ../.forge-vendor (puppetlabs-stdlib, vendored on demand - see its
#  own .gitkeep and the root .gitignore) - ensure_packages/ensure_
#  resource/any2array/dirname/file_line all come from there.
modulepath = ../shared_modules:../.forge-vendor
