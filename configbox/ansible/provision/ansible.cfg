[defaults]
# .galaxy-vendor/ - gitignored, regenerated on demand with
#  `ansible-galaxy install -r requirements.yml` (installs both the
#  roles: and collections: sections in one pass) - same
#  fetched-not-committed pattern as configbox/chef/.berks-vendor/ (see
#  that cookbook's own Berksfile). NOT independently verified in this
#  environment (no ansible-galaxy/ansible-playbook binary available to
#  test against) - Ansible's own docs are not fully explicit on whether
#  a relative roles_path/collections_paths resolves against this file's
#  own directory or the invoking shell's cwd. If `vagrant up` can't find
#  vendored content, set ANSIBLE_CONFIG explicitly (or switch these two
#  paths to absolute) rather than assuming this guess was right.
roles_path = .galaxy-vendor/roles
collections_paths = .galaxy-vendor/collections
