---
# meta file for cibox
#
# diodonfrost.act (see ../../requirements.yml, vendored to
#  ../../.galaxy-vendor/roles/ by `ansible-galaxy install -r
#  requirements.yml` - never committed, see ../../ansible.cfg) installs
#  nektos/act itself. A role dependency here, not an include_role task
#  in ../tasks/main.yml - "cibox needs act installed" is unconditional,
#  not something any of this role's own logic decides at runtime, and a
#  dependency is guaranteed to run before this role's own tasks start.
dependencies:
  - role: diodonfrost.act
