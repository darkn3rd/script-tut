---
# Run with: ansible-playbook -i inventory test.yml
#
# check_mode: true - a structure/rendering smoke test, not a real install
#  (command/shell tasks - most of gem/the special scripts - don't support
#  check mode, so they're skipped rather than run). See
#  ../../systems/ubuntu_2204/Vagrantfile for the real end-to-end test.
- hosts: localhost
  become: true
  gather_facts: true
  check_mode: true
  roles:
    - scriptbox
